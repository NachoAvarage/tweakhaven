<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#595959">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="CoolKidz"
    >

    <title>CoolKidz</title>

    <link rel="manifest" href="manifest.json">

    <link
        rel="icon"
        type="image/svg+xml"
        href="icon.svg"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --menu: #595959;
            --sidebar: #505050;
            --card: #626262;
            --button: #6c6c6c;
            --hover: #7d7d7d;

            --text: #ffffff;
            --secondary: #cdcdcd;
            --muted: #a9a9a9;

            --green: #468c5a;

            --radius: 20px;
        }

        html {
            width: 100%;
            height: 100%;
            background: var(--menu);
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(255,255,255,0.035),
                    transparent 35%
                ),
                var(--menu);

            color: var(--text);

            font-family:
                "Segoe UI",
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            overflow: hidden;

            user-select: none;

            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
        }

        /* =========================================================
           APP
           ========================================================= */

        #app {
            width: 100%;
            height: 100%;

            display: flex;

            padding:
                max(15px, env(safe-area-inset-top))
                max(15px, env(safe-area-inset-right))
                max(15px, env(safe-area-inset-bottom))
                max(15px, env(safe-area-inset-left));

            gap: 20px;
        }

        /* =========================================================
           SIDEBAR
           ========================================================= */

        .sidebar {
            width: 210px;
            min-width: 210px;

            height: 100%;

            background: var(--sidebar);

            border-radius: 18px;

            padding: 25px 20px;

            display: flex;
            flex-direction: column;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 29px;
            font-weight: 700;

            letter-spacing: -1px;

            margin-left: 5px;
        }

        .logo-subtitle {
            font-size: 8px;
            font-weight: 700;

            letter-spacing: 1px;

            color: #cdcdcd;

            margin-left: 7px;
            margin-top: 2px;
        }

        .navigation {
            display: flex;
            flex-direction: column;

            gap: 10px;

            margin-top: 40px;
        }

        .nav-button {
            width: 100%;
            height: 45px;

            border: 0;
            outline: 0;

            border-radius: 12px;

            background: var(--button);

            color: white;

            cursor: pointer;

            text-align: left;

            padding: 0 15px;

            font-size: 11px;
            font-weight: 500;

            transition:
                background 0.16s ease,
                transform 0.16s ease;
        }

        .nav-button:hover {
            background: var(--hover);
        }

        .nav-button:active {
            transform: scale(0.97);
        }

        .nav-button.active {
            background: #7b7b7b;
        }

        .sidebar-version {
            margin-top: auto;

            color: #a9a9a9;

            font-size: 8px;

            margin-left: 5px;
        }

        /* =========================================================
           CONTENT
           ========================================================= */

        .content {
            flex: 1;

            min-width: 0;

            height: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 25px 25px 40px;

            scrollbar-width: thin;
            scrollbar-color: #777 transparent;
        }

        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        .content::-webkit-scrollbar-thumb {
            background: #777;
            border-radius: 20px;
        }

        .page {
            animation: pageIn 0.18s ease;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;

            letter-spacing: -0.8px;

            margin: 25px 0 7px;
        }

        .page-description {
            color: var(--secondary);

            font-size: 11px;

            margin-bottom: 40px;
        }

        /* =========================================================
           CARDS
           ========================================================= */

        .card {
            width: 100%;

            background: var(--card);

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 20px;

            transition:
                transform 0.18s ease,
                background 0.18s ease;
        }

        .card:hover {
            background: #686868;
            transform: translateY(-1px);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .card-description {
            color: var(--secondary);

            font-size: 10px;

            line-height: 1.5;
        }

        /* =========================================================
           BUTTONS
           ========================================================= */

        .primary-button {
            border: 0;
            outline: 0;

            background: var(--button);

            color: white;

            padding: 12px 18px;

            border-radius: 11px;

            cursor: pointer;

            font-size: 10px;
            font-weight: 700;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .primary-button:hover {
            background: var(--hover);
        }

        .primary-button:active {
            transform: scale(0.97);
        }

        .primary-button.green {
            background: var(--green);
        }

        /* =========================================================
           APPS
           ========================================================= */

        .apps-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));

            gap: 18px;
        }

        .app-card {
            background: var(--card);

            border-radius: 16px;

            padding: 20px;

            min-height: 205px;

            display: flex;
            flex-direction: column;

            transition:
                transform 0.18s ease,
                background 0.18s ease;
        }

        .app-card:hover {
            background: #686868;

            transform:
                translateY(-3px);
        }

        .app-header {
            display: flex;
            align-items: center;

            gap: 13px;

            margin-bottom: 14px;
        }

        .app-icon {
            width: 45px;
            height: 45px;

            border-radius: 13px;

            background: #505050;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            flex-shrink: 0;
        }

        .app-name {
            font-size: 15px;
            font-weight: 700;
        }

        .app-type {
            color: #bdbdbd;

            font-size: 8px;

            margin-top: 2px;
        }

        .app-description {
            color: var(--secondary);

            font-size: 9px;

            line-height: 1.55;

            margin-bottom: 14px;
        }

        .compatibility {
            background: rgba(0,0,0,0.12);

            border-radius: 9px;

            padding: 9px;

            color: #dedede;

            font-size: 8px;

            line-height: 1.5;

            margin-bottom: 14px;
        }

        .app-actions {
            margin-top: auto;

            display: flex;

            gap: 8px;
        }

        .app-actions a {
            flex: 1;

            text-decoration: none;

            text-align: center;
        }

        /* =========================================================
           WARNING
           ========================================================= */

        .warning {
            background: rgba(0,0,0,0.13);

            border-radius: 14px;

            padding: 15px;

            margin-bottom: 25px;

            color: #dedede;

            font-size: 9px;

            line-height: 1.6;
        }

        .warning strong {
            color: white;
        }

        /* =========================================================
           TEST PAGE
           ========================================================= */

        .test-box {
            min-height: 250px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            background: var(--card);

            border-radius: 18px;
        }

        .test-circle {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: #737373;

            margin-bottom: 20px;

            animation:
                pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        .test-status {
            color: #cfcfcf;

            font-size: 10px;
        }

        /* =========================================================
           SETTINGS
           ========================================================= */

        .setting-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .setting-label {
            font-size: 11px;
            font-weight: 700;
        }

        .setting-description {
            color: #c0c0c0;

            font-size: 8px;

            margin-top: 4px;
        }

        .switch {
            position: relative;

            width: 48px;
            height: 26px;

            flex-shrink: 0;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;

            inset: 0;

            background: #444;

            border-radius: 30px;

            cursor: pointer;

            transition: 0.2s;
        }

        .slider::before {
            content: "";

            position: absolute;

            width: 20px;
            height: 20px;

            left: 3px;
            top: 3px;

            background: white;

            border-radius: 50%;

            transition: 0.2s;
        }

        .switch input:checked + .slider {
            background: var(--green);
        }

        .switch input:checked + .slider::before {
            transform: translateX(22px);
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            body {
                overflow: auto;
            }

            #app {
                min-height: 100%;
                height: auto;

                flex-direction: column;

                padding: 10px;
            }

            .sidebar {
                width: 100%;
                min-width: 0;

                height: auto;

                padding: 18px;

                border-radius: 17px;
            }

            .logo {
                font-size: 25px;
            }

            .navigation {
                flex-direction: row;

                gap: 7px;

                margin-top: 18px;
            }

            .nav-button {
                height: 42px;

                padding: 0;

                text-align: center;

                font-size: 10px;
            }

            .sidebar-version {
                display: none;
            }

            .content {
                height: auto;

                overflow: visible;

                padding:
                    5px
                    5px
                    30px;
            }

            .page-title {
                margin-top: 15px;

                font-size: 25px;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }
        }

        /* =========================================================
           INSTALL BUTTON
           ========================================================= */

        #installButton {
            display: none;

            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 999;

            background: #777;

            color: white;

            border: 0;

            padding: 13px 17px;

            border-radius: 13px;

            font-size: 10px;
            font-weight: 700;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.3);

            cursor: pointer;
        }

    </style>
</head>

<body>

<div id="app">

    <aside class="sidebar">

        <div class="logo">
            CoolKidz
        </div>

        <div class="logo-subtitle">
            UTILITIES
        </div>

        <nav class="navigation">

            <button
                class="nav-button"
                data-page="settings"
            >
                Settings
            </button>

            <button
                class="nav-button"
                data-page="apps"
            >
                Apps
            </button>

            <button
                class="nav-button"
                data-page="test"
            >
                Test
            </button>

        </nav>

        <div class="sidebar-version">
            CoolKidz Web v1.0
        </div>

    </aside>


    <main class="content" id="content">

        <!-- CONTENT IS GENERATED BY JAVASCRIPT -->

    </main>

</div>


<button id="installButton">
    Install CoolKidz
</button>


<script>

    /* =============================================================
       PAGE SYSTEM
       ============================================================= */

    const content = document.getElementById("content");

    const navButtons =
        document.querySelectorAll(".nav-button");


    function setActivePage(page) {

        navButtons.forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.page === page
            );

        });

    }


    function renderPage(html) {

        content.innerHTML = `
            <div class="page">
                ${html}
            </div>
        `;

        content.scrollTop = 0;
    }


    /* =============================================================
       SETTINGS
       ============================================================= */

    function showSettings() {

        setActivePage("settings");

        renderPage(`

            <h1 class="page-title">
                Settings
            </h1>

            <div class="page-description">
                CoolKidz configuration.
            </div>


            <div class="card">

                <div class="setting-row">

                    <div>

                        <div class="setting-label">
                            Dark Mode
                        </div>

                        <div class="setting-description">
                            Keep the CoolKidz interface in dark mode.
                        </div>

                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            checked
                            disabled
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Theme
                </div>

                <div class="card-description">
                    Solid dark gray interface inspired by the
                    original CoolKidz Windows application.
                    Main color: #595959.
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Progressive Web App
                </div>

                <div class="card-description">
                    Add CoolKidz to your home screen and open it
                    as an installed app. The site uses a standalone
                    PWA display mode instead of opening as a normal
                    browser tab.
                </div>

            </div>

        `);
    }


    /* =============================================================
       APPS
       ============================================================= */

    function showApps() {

        setActivePage("apps");

        renderPage(`

            <h1 class="page-title">
                Apps
            </h1>

            <div class="page-description">
                Jailbreak tools and projects from their official
                sources.
            </div>


            <div class="warning">

                <strong>Important:</strong>
                There is no jailbreak that can honestly be called
                completely risk-free. Only use tools that match your
                exact device and iOS/iPadOS version, make a backup
                first, and use the project's official source.
                Avoid random IPA/EXE downloads from unofficial sites.

            </div>


            <div class="apps-grid">


                <!-- PALERA1N -->

                <article class="app-card">

                    <div class="app-header">

                        <div class="app-icon">
                            P
                        </div>

                        <div>

                            <div class="app-name">
                                palera1n
                            </div>

                            <div class="app-type">
                                CHECKM8 JAILBREAK
                            </div>

                        </div>

                    </div>


                    <div class="app-description">

                        An actively maintained jailbreak project
                        for compatible checkm8 devices. The official
                        project states support for A8 through A11
                        devices and T2 devices, with current work
                        covering newer supported Apple OS versions.

                    </div>


                    <div class="compatibility">

                        <strong>Best for:</strong>
                        Compatible checkm8 devices.

                        <br>

                        <strong>Important:</strong>
                        Semi-tethered behavior means the jailbreak
                        environment needs to be re-entered after
                        certain reboots.

                    </div>


                    <div class="app-actions">

                        <a
                            class="primary-button"
                            href="https://github.com/palera1n/palera1n"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            GitHub
                        </a>

                        <a
                            class="primary-button"
                            href="https://palera.in/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Official
                        </a>

                    </div>

                </article>


                <!-- DOPAMINE -->

                <article class="app-card">

                    <div class="app-header">

                        <div class="app-icon">
                            D
                        </div>

                        <div>

                            <div class="app-name">
                                Dopamine
                            </div>

                            <div class="app-type">
                                ROOTLESS JAILBREAK
                            </div>

                        </div>

                    </div>


                    <div class="app-description">

                        A rootless semi-untethered jailbreak project
                        from opa334. The official repository lists
                        support across specific iOS/iPadOS versions
                        and device architectures.

                    </div>


                    <div class="compatibility">

                        <strong>Best for:</strong>
                        Devices and OS versions specifically listed
                        by the official Dopamine project.

                        <br>

                        Always verify compatibility before attempting
                        anything.

                    </div>


                    <div class="app-actions">

                        <a
                            class="primary-button"
                            href="https://github.com/opa334/Dopamine"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            GitHub
                        </a>

                        <a
                            class="primary-button"
                            href="https://ellekit.space/dopamine/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Official
                        </a>

                    </div>

                </article>


                <!-- SAFETY CARD -->

                <article class="app-card">

                    <div class="app-header">

                        <div class="app-icon">
                            !
                        </div>

                        <div>

                            <div class="app-name">
                                Safety Check
                            </div>

                            <div class="app-type">
                                BEFORE JAILBREAKING
                            </div>

                        </div>

                    </div>


                    <div class="app-description">

                        Use official project documentation to
                        confirm your exact device and software
                        version before downloading anything.

                    </div>


                    <div class="compatibility">

                        Never use a jailbreak simply because a
                        website claims it supports your phone.

                        <br><br>

                        Check the official repository and release
                        information first.

                    </div>


                    <div class="app-actions">

                        <a
                            class="primary-button"
                            href="https://ios.cfw.guide/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Compatibility Guide
                        </a>

                    </div>

                </article>


            </div>

        `);
    }


    /* =============================================================
       TEST
       ============================================================= */

    function showTest() {

        setActivePage("test");

        renderPage(`

            <h1 class="page-title">
                Test
            </h1>

            <div class="page-description">
                Test the CoolKidz web interface.
            </div>


            <div class="test-box">

                <div class="test-circle"></div>

                <div class="card-title">
                    CoolKidz is running
                </div>

                <div class="test-status">
                    Web interface loaded successfully.
                </div>

            </div>

        `);

    }


    /* =============================================================
       NAVIGATION
       ============================================================= */

    navButtons.forEach(button => {

        button.addEventListener("click", () => {

            const page = button.dataset.page;

            if (page === "settings") {
                showSettings();
            }

            if (page === "apps") {
                showApps();
            }

            if (page === "test") {
                showTest();
            }

        });

    });


    /* =============================================================
       INITIAL PAGE
       ============================================================= */

    showApps();


    /* =============================================================
       PWA INSTALL
       ============================================================= */

    let deferredInstallPrompt = null;

    const installButton =
        document.getElementById("installButton");


    window.addEventListener(
        "beforeinstallprompt",
        event => {

            event.preventDefault();

            deferredInstallPrompt = event;

            installButton.style.display = "block";

        }
    );


    installButton.addEventListener(
        "click",
        async () => {

            if (!deferredInstallPrompt) {
                return;
            }

            deferredInstallPrompt.prompt();

            await deferredInstallPrompt.userChoice;

            deferredInstallPrompt = null;

            installButton.style.display = "none";

        }
    );


    window.addEventListener(
        "appinstalled",
        () => {

            installButton.style.display = "none";

        }
    );


    /* =============================================================
       SERVICE WORKER
       ============================================================= */

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            () => {

                navigator.serviceWorker.register(
                    "./sw.js"
                ).catch(error => {

                    console.error(
                        "Service worker registration failed:",
                        error
                    );

                });

            }
        );

    }

</script>

</body>
</html>
